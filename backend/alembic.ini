# Alembic configuration file for Qadam backend.
# The [alembic] section is the only required section.

[alembic]
# Path to migration scripts, relative to this file.
script_location = alembic

# Template for new revision files.
file_template = %%(year)d%%(month).2d%%(day).2d_%%(hour).2d%%(minute).2d_%%(rev)s_%%(slug)s

# Timezone for generated timestamps.
timezone = UTC

# DATABASE_URL is supplied entirely by env.py (reads from app.config.Settings),
# so we leave sqlalchemy.url blank here.
sqlalchemy.url =

[post_write_hooks]
# hooks = (none for MVP)

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %%H:%%M:%%S
