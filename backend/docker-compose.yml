services:
  qadam-backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: qadam_backend
    restart: unless-stopped
    ports:
      # Map host port 8001 (or custom PORT from .env) to container port 8000
      # Change 8001 if your existing container already uses it
      - "${HOST_PORT:-8001}:8000"
    env_file:
      - .env
    # Run database migrations before starting the uvicorn server
    command: >
      sh -c "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000"
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8000/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s

