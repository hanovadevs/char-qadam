name: Validate and build Android release
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      API_BASE_URL: ${{ vars.API_BASE_URL }}
      PUBLIC_PRIVACY_URL: ${{ vars.PUBLIC_PRIVACY_URL }}
      ACCOUNT_DELETION_URL: ${{ vars.ACCOUNT_DELETION_URL }}
      PUBLIC_SUPPORT_EMAIL: ${{ vars.PUBLIC_SUPPORT_EMAIL }}
      PUBLISHER_NAME: ${{ vars.PUBLISHER_NAME }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Validate public release configuration
        shell: bash
        run: |
          for name in API_BASE_URL PUBLIC_PRIVACY_URL ACCOUNT_DELETION_URL; do
            [[ "${!name}" == https://* ]] || { echo "Missing HTTPS value for $name"; exit 1; }
          done
          test -n "$PUBLIC_SUPPORT_EMAIL"
          test -n "$PUBLISHER_NAME"
      - name: Install pinned Flutter SDK
        run: |
          git clone --depth 1 --branch 3.47.7 https://github.com/flutter/flutter.git "$RUNNER_TEMP/flutter"
          echo "$RUNNER_TEMP/flutter/bin" >> "$GITHUB_PATH"
      - name: Install Android platform
        run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0'
      - name: Configure upload signing
        env:
          UPLOAD_KEYSTORE_BASE64: ${{ secrets.UPLOAD_KEYSTORE_BASE64 }}
          UPLOAD_STORE_PASSWORD: ${{ secrets.UPLOAD_STORE_PASSWORD }}
          UPLOAD_KEY_PASSWORD: ${{ secrets.UPLOAD_KEY_PASSWORD }}
          UPLOAD_KEY_ALIAS: ${{ secrets.UPLOAD_KEY_ALIAS }}
        run: |
          test -n "$UPLOAD_KEYSTORE_BASE64"
          umask 077
          printf '%s' "$UPLOAD_KEYSTORE_BASE64" | base64 --decode > mobile/android/upload-keystore.jks
          printf 'storeFile=../upload-keystore.jks\nstorePassword=%s\nkeyPassword=%s\nkeyAlias=%s\n' "$UPLOAD_STORE_PASSWORD" "$UPLOAD_KEY_PASSWORD" "$UPLOAD_KEY_ALIAS" > mobile/android/key.properties
      - name: Validate Flutter
        working-directory: mobile
        run: |
          flutter pub get
          flutter analyze
          flutter test
      - name: Build signed app bundle
        working-directory: mobile
        run: |
          flutter build appbundle --release --dart-define="API_BASE_URL=$API_BASE_URL" --dart-define="PRIVACY_POLICY_URL=$PUBLIC_PRIVACY_URL" --dart-define="ACCOUNT_DELETION_URL=$ACCOUNT_DELETION_URL" --dart-define="SUPPORT_EMAIL=$PUBLIC_SUPPORT_EMAIL" --dart-define="PUBLISHER_NAME=$PUBLISHER_NAME"
      - uses: actions/upload-artifact@v4
        with:
          name: stepsy-play-store-bundle
          path: mobile/build/app/outputs/bundle/release/app-release.aab
