# Include inside nginx's http context. Configure your domain and TLS certificate
# paths before enabling. Keep port 8000 reachable only from localhost.
limit_req_zone $binary_remote_addr zone=qadam_auth:10m rate=10r/m;
limit_req_status 429;

server {
    listen 80;
    server_name api.example.com;
    return 301 https://$host$request_uri;
}
server {
    listen 443 ssl;
    server_name api.example.com;
    ssl_certificate /etc/letsencrypt/live/api.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.example.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    client_max_body_size 1m;
    gzip on;
    gzip_min_length 1024;
    gzip_vary on;
    gzip_types application/json application/javascript text/css image/svg+xml;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Strict-Transport-Security 'max-age=31536000' always;

    location /assets/ {
        alias /opt/qadam/web/dist/assets/;
        expires 1y;
        add_header Cache-Control 'public, immutable';
    }
    location ~ ^/(auth/(login|register|google|forgot-password|reset-password)|admin/auth/login)/?$ {
        limit_req zone=qadam_auth burst=10 nodelay;
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }
    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }
}
